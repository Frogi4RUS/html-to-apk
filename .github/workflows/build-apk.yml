name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App name"
        required: true
        default: "HTML to APK"
        type: string
      package_name:
        description: "Package name"
        required: true
        default: "com.frogi4rus.htmltoapk"
        type: string
      mode:
        description: "Website source"
        required: true
        type: choice
        options:
          - url
          - html
        default: url
      site_url:
        description: "HTTPS website URL"
        required: true
        default: "https://frogi4rus.github.io/html-to-apk/"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          MODE: ${{ inputs.mode }}
          SITE_URL: ${{ inputs.site_url }}
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$PACKAGE_NAME" =~ ^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$ ]]; then
            echo "Invalid package name"
            exit 1
          fi

          if [[ "$MODE" == "url" ]] && [[ ! "$SITE_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo "A valid HTTPS URL is required"
            exit 1
          fi

          PACKAGE_PATH="${PACKAGE_NAME//./\/}"
          mkdir -p "app/src/main/java/$PACKAGE_PATH"
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WebsiteApp"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace "${PACKAGE_NAME}"
              compileSdk 35

              defaultConfig {
                  applicationId "${PACKAGE_NAME}"
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > "app/src/main/java/$PACKAGE_PATH/MainActivity.java" <<EOF
          package ${PACKAGE_NAME};

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.view.ViewGroup;
          import android.view.Window;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);

                  webView = new WebView(this);
                  webView.setLayoutParams(new ViewGroup.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                  ));

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  setContentView(webView);

                  if ("${MODE}".equals("url")) {
                      webView.loadUrl("${SITE_URL}");
                  } else {
                      webView.loadUrl("file:///android_asset/index.html");
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="${APP_NAME}"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          if [[ "$MODE" == "html" ]]; then
            if [[ ! -f index.html ]]; then
              echo "index.html was not found in the repository root"
              exit 1
            fi
            cp index.html app/src/main/assets/index.html
          fi

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: html-to-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
