name: Build HTML to APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: Application name
        required: true
        default: My HTML App
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Find HTML file
        run: |
          echo "Repository files:"
          find . -maxdepth 5 -type f

          if [ -f "uploads/index.html" ]; then
            HTML_FILE="uploads/index.html"
          elif [ -f "index.html" ]; then
            HTML_FILE="index.html"
          else
            echo "HTML file not found"
            exit 1
          fi

          mkdir -p app/src/main/assets
          cp "$HTML_FILE" app/src/main/assets/index.html

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/example/htmlapp
          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
            <string name="app_name">My HTML App</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
              android:theme="@android:style/Theme.Material.Light.NoActionBar"
              android:label="@string/app_name">
              <activity
                android:name=".MainActivity"
                android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/htmlapp/MainActivity.java <<'EOF'
          package com.example.htmlapp;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;

          public class MainActivity extends Activity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              WebView web = new WebView(this);
              web.getSettings().setJavaScriptEnabled(true);
              web.getSettings().setDomStorageEnabled(true);
              web.setWebViewClient(new WebViewClient());
              web.setWebChromeClient(new WebChromeClient());
              setContentView(web);
              web.loadUrl("file:///android_asset/index.html");
            }
          }
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "HTMLToAPK"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
          }

          android {
            namespace 'com.example.htmlapp'
            compileSdk 35

            defaultConfig {
              applicationId 'com.example.htmlapp'
              minSdk 23
              targetSdk 28
              versionCode 1
              versionName '1.0'
            }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: html-app-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
