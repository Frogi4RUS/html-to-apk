
name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Название приложения"
        required: true
        default: "HTML2APK"
      package_name:
        description: "Идентификатор приложения"
        required: true
        default: "com.example.html2apk"
      site_url:
        description: "Адрес сайта"
        required: true
        default: "https://frogi4rus.github.io/html-to-apk/"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ inputs.app_name }}
      PACKAGE_NAME: ${{ inputs.package_name }}
      SITE_URL: ${{ inputs.site_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create Android project
        shell: bash
        run: |
          set -e
          PACKAGE_PATH="${PACKAGE_NAME//./\/}"
          mkdir -p "app/src/main/java/$PACKAGE_PATH"

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HTML2APK"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace '__PACKAGE__'
              compileSdk 35

              defaultConfig {
                  applicationId '__PACKAGE__'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="__APP_NAME__"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name="__PACKAGE__.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "app/src/main/java/$PACKAGE_PATH/MainActivity.java" <<'EOF'
          package __PACKAGE__;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient.FileChooserParams;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;
              private static final int FILE_REQUEST = 1001;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView view,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams params) {
                          if (fileCallback != null) {
                              fileCallback.onReceiveValue(null);
                          }
                          fileCallback = callback;

                          Intent intent;
                          try {
                              intent = params.createIntent();
                          } catch (Exception e) {
                              intent = new Intent(Intent.ACTION_GET_CONTENT);
                              intent.addCategory(Intent.CATEGORY_OPENABLE);
                              intent.setType("*/*");
                          }

                          try {
                              startActivityForResult(intent, FILE_REQUEST);
                              return true;
                          } catch (Exception e) {
                              fileCallback = null;
                              callback.onReceiveValue(null);
                              return false;
                          }
                      }
                  });

                  setContentView(webView);
                  webView.loadUrl("__SITE_URL__");
              }

              @Override
              protected void onActivityResult(
                      int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_REQUEST && fileCallback != null) {
                      Uri[] result = null;
                      if (resultCode == RESULT_OK && data != null
                              && data.getData() != null) {
                          result = new Uri[]{data.getData()};
                      }
                      fileCallback.onReceiveValue(result);
                      fileCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          export PACKAGE_PATH
          python3 - <<'PY'
          import os
          from pathlib import Path

          replacements = {
              "__PACKAGE__": os.environ["PACKAGE_NAME"],
              "__APP_NAME__": os.environ["APP_NAME"],
              "__SITE_URL__": os.environ["SITE_URL"],
          }
          for path in [
              Path("app/build.gradle"),
              Path("app/src/main/AndroidManifest.xml"),
              Path("app/src/main/java") / os.environ["PACKAGE_NAME"].replace(".", "/") / "MainActivity.java",
          ]:
              content = path.read_text()
              for old, new in replacements.items():
                  content = content.replace(old, new)
              path.write_text(content)
          PY

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: html-to-apk
          path: app/build/outputs/apk/debug/app-debug.apk
