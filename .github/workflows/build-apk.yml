
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: App name
        required: true
        default: My App
      package_name:
        description: Package name
        required: true
        default: com.example.myapp
      mode:
        description: url or html
        required: true
        type: choice
        options:
          - url
          - html
      site_url:
        description: HTTPS URL
        required: false
        default: https://example.com

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate project
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          MODE: ${{ inputs.mode }}
          SITE_URL: ${{ inputs.site_url }}
        run: |
          set -e
          mkdir -p app/src/main/java app/src/main/assets
          PKG_PATH="${PACKAGE_NAME//./\/}"
          mkdir -p "app/src/main/java/$PKG_PATH"

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "HtmlToApk"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          echo 'org.gradle.jvmargs=-Xmx2g' > gradle.properties

          cat > app/build.gradle.kts <<EOF
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "$PACKAGE_NAME"
              compileSdk = 35
              defaultConfig {
                  applicationId = "$PACKAGE_NAME"
                  minSdk = 23
                  targetSdk = 28
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          EOF

          if [ "$MODE" = "url" ]; then
            echo "Using URL: $SITE_URL"
            PERMISSION='<uses-permission android:name="android.permission.INTERNET" />'
            LOAD='webView.loadUrl("'$SITE_URL'")'
          else
            echo "HTML mode selected"
            test -f input/index.html || { echo "Missing input/index.html"; exit 1; }
            cp input/index.html app/src/main/assets/index.html
            PERMISSION=''
            LOAD='webView.loadUrl("file:///android_asset/index.html")'
          fi

          cat > app/src/main/AndroidManifest.xml <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            $PERMISSION
            <application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="$APP_NAME">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > "app/src/main/java/$PKG_PATH/MainActivity.kt" <<EOF
          package $PACKAGE_NAME
          import android.app.Activity
          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebViewClient
          class MainActivity : Activity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              val webView = WebView(this)
              webView.settings.javaScriptEnabled = true
              webView.settings.domStorageEnabled = true
              webView.webViewClient = WebViewClient()
              setContentView(webView)
              $LOAD
            }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
